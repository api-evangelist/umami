related_finding: >-
  Umami does publish a vulnerability disclosure policy and a security contact
  (security@umami.is) — but as an HTML page at https://umami.is/security, not as
  a machine-readable /.well-known/security.txt. Serving that page's contact and
  policy URLs as an RFC 9116 security.txt would be a one-file change on the
  provider's side. See security/umami-vulnerability-disclosure.yml.
