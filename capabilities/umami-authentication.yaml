naftiko: 1.0.0-alpha2
info:
  label: Umami Analytics API — Authentication
  description: 'Umami Analytics API — Authentication. 2 operations. Lead operation: Umami Login. Self-contained Naftiko capability
    covering one Umami business surface.'
  tags:
  - Umami
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UMAMI_API_KEY: UMAMI_API_KEY
capability:
  consumes:
  - type: http
    namespace: umami-authentication
    baseUri: https://api.umami.is
    description: Umami Analytics API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: api-auth-login
      path: /api/auth/login
      operations:
      - name: login
        method: POST
        description: Umami Login
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-auth-verify
      path: /api/auth/verify
      operations:
      - name: verifytoken
        method: POST
        description: Umami Verify Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.UMAMI_API_KEY}}'
  exposes:
  - type: rest
    namespace: umami-authentication-rest
    port: 8080
    description: REST adapter for Umami Analytics API — Authentication. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/auth/login
      name: api-auth-login
      description: REST surface for api-auth-login.
      operations:
      - method: POST
        name: login
        description: Umami Login
        call: umami-authentication.login
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/auth/verify
      name: api-auth-verify
      description: REST surface for api-auth-verify.
      operations:
      - method: POST
        name: verifytoken
        description: Umami Verify Token
        call: umami-authentication.verifytoken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: umami-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Umami Analytics API — Authentication. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: umami-login
      description: Umami Login
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: umami-authentication.login
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: umami-verify-token
      description: Umami Verify Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: umami-authentication.verifytoken
      outputParameters:
      - type: object
        mapping: $.
