packages:
  - name: '@umami/api-client'
    registry: npm
    language: typescript
    official: true
    version: 0.80.0
    published: '2025-07-25'
    url: https://www.npmjs.com/package/@umami/api-client
    repository: https://github.com/umami-software/api-client
    install: npm install @umami/api-client
    docs: https://docs.umami.is/docs/api/api-client
    description: >-
      TypeScript client with a method for every Umami API endpoint. Configured by
      environment variable (UMAMI_API_CLIENT_USER_ID / UMAMI_API_CLIENT_SECRET /
      UMAMI_API_CLIENT_ENDPOINT for self-hosted, or UMAMI_API_KEY +
      UMAMI_API_CLIENT_ENDPOINT for Umami Cloud). Every call returns
      { ok, status, data?, error? }.
    note: >-
      Currency signal: the newest release (0.80.0, 2025-07-25) predates Umami v3.0
      (2025-12-12) and every v3 API addition documented in the cloud changelog
      through 2026-05-28 (revenue, event-data-pivot, session-data-pivot, links,
      pixels, recorder, performance reports). The function map published in the
      docs still lists the v2 surface, including /event-data/* paths the changelog
      says moved under /websites/[id]/ in 2024. The official client therefore does
      not cover the current API.
