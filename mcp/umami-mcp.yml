      No MCP repository. The org ships umami, shiso, docs, zen, api-client,
      node, redis-client, prisma-client, esbuild-plugin-css-modules, cli,
      migrate-v1-v2, types.
    date: '2026-08-13'
  - target: npm @umami scope
    result: >-
      No @umami/mcp package. Scope contains api-client, node, components, cli,
      shiso, prisma-client, redis-client.
    date: '2026-08-13'
  - target: docs.umami.is (full corpus via llms-full.txt)
    result: No mention of MCP, Model Context Protocol, or an agent surface.
    date: '2026-08-13'
  - target: /.well-known/ probes on umami.is, api.umami.is, cloud.umami.is, docs.umami.is
    result: >-
      No agent card, no ai-plugin.json, no oauth-protected-resource. api.umami.is
      answers 405 to every non-API GET.
    date: '2026-08-13'
