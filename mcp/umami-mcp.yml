candidate_tools:
  note: >-
    Derived from operations that exist in openapi/ and are confirmed present in
    the published API reference. inputSchema fields are the documented request
    parameters. This is a design sketch, not a served contract.
  tools:
    - name: list_websites
      description: List the websites this credential can read, with paging and search.
      rest: {method: GET, path: /websites, operationId: listWebsites}
      inputSchema: {page: number, pageSize: number, search: string, includeTeams: boolean}
      read_only: true
    - name: get_website
      description: Fetch one website by ID.
      rest: {method: GET, path: '/websites/{websiteId}', operationId: getWebsite}
      inputSchema: {websiteId: string}
      read_only: true
    - name: get_website_stats
      description: >-
        Summary metrics for a website over a time window — pageviews, visitors,
        visits, bounces, totaltime, with optional period-over-period comparison.
      rest: {method: GET, path: '/websites/{websiteId}/stats', operationId: getWebsiteStats}
      inputSchema: {websiteId: string, startAt: number, endAt: number}
      read_only: true
    - name: get_website_pageviews
      description: Pageview and session time series bucketed by unit.
      rest: {method: GET, path: '/websites/{websiteId}/pageviews', operationId: getWebsitePageviews}
      inputSchema: {websiteId: string, startAt: number, endAt: number, unit: string}
      read_only: true
    - name: get_website_metrics
      description: >-
        Breakdown of a single dimension (path, referrer, browser, os, device,
        country, ...) for a window.
      rest: {method: GET, path: '/websites/{websiteId}/metrics', operationId: getWebsiteMetrics}
      inputSchema: {websiteId: string, startAt: number, endAt: number, type: string}
      read_only: true
    - name: get_active_visitors
      description: Current visitor count for a website.
      rest: {method: GET, path: '/websites/{websiteId}/active', operationId: getActiveVisitors}
      inputSchema: {websiteId: string}
      read_only: true
    - name: get_event_series
      description: Custom event counts as a time series.
      rest: {method: GET, path: '/websites/{websiteId}/events/series', operationId: getEventSeries}
      inputSchema: {websiteId: string, startAt: number, endAt: number, unit: string}
      read_only: true
    - name: list_sessions
      description: Paginated visitor sessions for a website.
      rest: {method: GET, path: '/websites/{websiteId}/sessions', operationId: listSessions}
      inputSchema: {websiteId: string, startAt: number, endAt: number, page: number, pageSize: number}
      read_only: true
    - name: get_session_stats
      description: Aggregate session statistics for a website.
      rest: {method: GET, path: '/websites/{websiteId}/sessions/stats', operationId: getSessionStats}
      inputSchema: {websiteId: string, startAt: number, endAt: number}
      read_only: true
    - name: list_teams
      description: List teams visible to this credential.
      rest: {method: GET, path: /teams, operationId: listTeams}
      inputSchema: {page: number, pageSize: number}
      read_only: true
    - name: get_team
      description: Fetch one team by ID.
      rest: {method: GET, path: '/teams/{teamId}', operationId: getTeam}
      inputSchema: {teamId: string}
      read_only: true
    - name: list_team_websites
      description: List the websites belonging to a team.
      rest: {method: GET, path: '/teams/{teamId}/websites', operationId: listTeamWebsites}
      inputSchema: {teamId: string}
      read_only: true
    - name: create_website
      description: Register a website for tracking.
      rest: {method: POST, path: /websites, operationId: createWebsite}
      inputSchema: {name: string, domain: string, shareId: string, teamId: string}
      read_only: false
      destructive: false
    - name: update_website
      description: Update a website's name, domain, share ID or replay configuration.
      rest: {method: POST, path: '/websites/{websiteId}', operationId: updateWebsite}
      inputSchema: {websiteId: string, name: string, domain: string, shareId: string, replayConfig: object}
      read_only: false
      destructive: false
    - name: delete_website
      description: Delete a website and its analytics data.
      rest: {method: DELETE, path: '/websites/{websiteId}', operationId: deleteWebsite}
      inputSchema: {websiteId: string}
      read_only: false
      destructive: true
design_notes:
  - >-
    Read tools would dominate. Umami's value to an agent is querying analytics,
    and every high-value operation is a GET.
  - >-
    A Cloud-backed server must target https://api.umami.is/v1 (no /api prefix)
    and must NOT expose /users or /me/password — Umami bars API keys from those
    routes entirely.
  - >-
    A server would have to enforce the 50-calls-per-15-seconds budget itself.
    Umami returns no rate-limit headers, so a naive tool loop will hit the
    ceiling with no warning.
  - >-
    startAt/endAt are UNIX milliseconds and the `unit` parameter is silently
    promoted on long ranges — a tool wrapper should normalize both and report
    the granularity actually returned.
