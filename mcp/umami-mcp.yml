description: >-
  Umami publishes no MCP server. This file is a DERIVED candidate tool list
  showing what a Umami MCP server would expose if one existed, mapped to real
  documented endpoints. Nothing here is served by Umami and no endpoint URL is
  asserted.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
  note: >-
    mode: none because nobody at Umami ships a server — neither a remote HTTPS
    endpoint an agent can POST to, nor a stdio package a human can install. No
    MCP endpoint URL is guessed here.
