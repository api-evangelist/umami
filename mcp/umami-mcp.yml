generated: '2026-10-20'
method: searched
source: https://docs.umami.is/docs/mcp
provider: Umami
providerId: umami
status: official
name: Umami MCP Server
description: 'Umami ships an official MCP server: a remote endpoint on Umami Cloud (https://cloud.umami.is/mcp), the same /mcp endpoint on self-hosted v3.4.0+ (MCP_ENABLED=1), and the @umami/mcp stdio package.
  All 23 tools are read-only. Tool names are as DOCUMENTED on docs.umami.is/docs/mcp; tools/list was not called because the endpoint requires an API key (anonymous probe returned 401).'
deployment:
  mode: both
  endpoint: https://cloud.umami.is/mcp
  install: npx -y @umami/mcp
  package: https://www.npmjs.com/package/@umami/mcp
  auth: api-key
  verified: probed
  note: 'Endpoint and install verbatim from https://docs.umami.is/docs/cloud/mcp. Anonymous probe of https://cloud.umami.is/mcp returned 401 (pre-flight 2026-10-20, control 200). Auth: Authorization: Bearer
    api_<cloud key> or x-umami-api-key; Pro, Business and Enterprise plans. Self-hosted endpoint https://<your-umami-instance>/mcp with umami_ keys. @umami/mcp latest 0.2.0 published 2026-09-10 (registry.npmjs.org).'
tools_source:
  l3: table
  evidence_url: https://docs.umami.is/docs/mcp
  live_tools_list: gated (401)
tools:
- name: list_websites
  description: Find the websites you can access (call first to get a `websiteId`).
  readOnly: true
- name: get_website_daterange
  description: Earliest and latest dates with recorded data.
  readOnly: true
- name: get_website_stats
  description: Pageviews, visitors, visits, bounce rate, duration, and previous period.
  readOnly: true
- name: get_website_traffic
  description: Pageview and visit time series by minute, hour, day, month, or year.
  readOnly: true
- name: get_website_metrics
  description: Top pages, referrers, channels, countries, browsers, devices, UTM, and events.
  readOnly: true
- name: get_realtime
  description: Visitors active right now.
  readOnly: true
- name: get_events
  description: Individual tracked events (paginated).
  readOnly: true
- name: get_event_stats
  description: Custom event totals and previous period.
  readOnly: true
- name: get_event_series
  description: Custom event counts over time, grouped by event name.
  readOnly: true
- name: get_event_properties
  description: Custom event property names, or the values of one property.
  readOnly: true
- name: get_sessions
  description: Visitor sessions (paginated).
  readOnly: true
- name: get_session
  description: One session with its activity timeline and properties.
  readOnly: true
- name: get_session_stats
  description: 'Session-level totals: visitors, visits, pageviews, events, countries.'
  readOnly: true
- name: get_annotations
  description: Dated notes on the timeline (launches, campaigns) that explain changes.
  readOnly: true
- name: list_segments
  description: Saved segments and cohorts; pass IDs via `filters.segment` or `filters.cohort`.
  readOnly: true
- name: list_funnels
  description: Saved funnels with their steps.
  readOnly: true
- name: run_funnel
  description: Conversion funnel from a saved `funnelId` or ad-hoc page and event steps.
  readOnly: true
- name: get_goals
  description: Saved goals with conversions, visitors, and rate for a date range.
  readOnly: true
- name: run_journey
  description: Most common paths visitors take.
  readOnly: true
- name: run_retention
  description: Cohort retention table.
  readOnly: true
- name: run_attribution
  description: First-click or last-click attribution for a conversion.
  readOnly: true
- name: get_revenue
  description: Revenue totals, series, and breakdowns.
  readOnly: true
- name: get_performance
  description: Web Vitals (LCP, INP, CLS, FCP, TTFB) percentiles, trend, and breakdown.
  readOnly: true
