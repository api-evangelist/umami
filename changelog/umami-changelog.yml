provider: Umami
providerId: umami
description: >-
  Umami maintains a dated changelog for Umami Cloud (cloud.umami.is) and the API
  (api.umami.is). Entries are grouped by date and labelled by area, and API
  entries name the exact route added, renamed, removed or changed. The
  self-hosted product versions separately through GitHub releases.
scheme: date-based
versioning:
  cloud: >-
    Umami Cloud is continuously delivered; there is no cloud version number. The
    changelog date is the only version identifier.
  api: >-
    The Umami Cloud API is served under a single major path segment, /v1
    (https://api.umami.is/v1). No second version has been published.
  self_hosted: >-
    Semantic versioning through GitHub releases at
    https://github.com/umami-software/umami/releases. Current release v3.3.0
    (2026-08-12).
current_version:
