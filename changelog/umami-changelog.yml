observations:
  - >-
    Umami documents breaking API changes clearly and with route-level precision,
    which is better than most providers of its size. What it does not do is
    version them: renames and removals land on the live /v1 surface on the day
    they ship. There is no Sunset or Deprecation header, no deprecation window,
    and no parallel old-path alias documented anywhere in the changelog.
  - >-
    The changelog is HTML only. There is no RSS/Atom feed and no machine-readable
    changelog document, so an agent must scrape it to detect a breaking change.
