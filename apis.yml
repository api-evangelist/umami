aid: umami
name: Umami
description: Umami is an open source, privacy-first web analytics platform that provides website traffic insights without cookies or personal
  data collection, serving as a simple and fast alternative to Google Analytics. The Umami API provides full programmatic access to analytics
  data, website management, session tracking, event data, and team collaboration features for both self-hosted and cloud instances.
