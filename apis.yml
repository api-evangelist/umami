aid: umami
name: Umami
description: >-
  Umami is an open source, privacy-first web analytics platform that provides website traffic insights without cookies
  or personal data collection, serving as a simple and fast alternative to Google Analytics. The Umami API provides full
  programmatic access to analytics data, website management, session tracking, event data, and team collaboration
  features for both self-hosted and cloud instances.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: true
  trial_days: 14
  try_now: true
  public: false
  api_free_tier: false
  api_entry_plan: Pro
  api_entry_price: '20.00'
  api_entry_currency: USD
  label: Freemium product, paid API · Self-serve signup · 14-day trial
  note: >-
    The PRODUCT has a free forever tier (Hobby, 100K events/month) and the
    self-hosted application is free under MIT. The API does NOT: API access
    begins at the Pro plan, $20/month. Verified on https://umami.is/pricing
    2026-08-13 — the feature-comparison table marks "API access" as absent on
    Hobby and present from Pro. Anyone evaluating Umami as an API cannot do so
    without paying.
  confidence: high
  source:
  - https://umami.is/pricing
  - plans/umami-plans-pricing.yml
  - authentication/umami-authentication.yml
  generated: '2026-08-13'
  method: searched
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/umami.png
tags:
  - Cookieless Tracking
  - Open Source
  - Privacy
  - Web Analytics
  - Website Analytics
  - Product Analytics
  - Event Tracking
  - Self-Hosted
  - GDPR
  - Session Replay
  - Heatmaps
  - Marketing Attribution
url: https://raw.githubusercontent.com/api-evangelist/umami/refs/heads/main/apis.yml
created: '2026-03-26'
modified: '2026-08-13'
