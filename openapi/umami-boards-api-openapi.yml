      x-umami-audience: public
      x-umami-contract: explicit
      x-umami-source: src/app/api/boards/[boardId]/contract.generated.ts
    post:
      description: Updates a board's name, description, or configuration and validates the resources and reports it references.
      operationId: updateBoard
      parameters:
      - description: ID of the board.
        in: path
        name: boardId
        required: true
