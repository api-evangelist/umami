          description: Server error.
      security:
      - bearerAuth: []
      - shareContext: []
        shareToken: []
      summary: Update a board
      tags:
      - Boards
      x-umami-audience: public
      x-umami-contract: explicit
      x-umami-source: src/app/api/boards/[boardId]/contract.generated.ts
  /api/boards/{boardId}/clone:
    post:
      description: Creates a copy of a board with optional changes to its name, description, and configuration. Removes invalid report references from the copy.
      operationId: cloneBoard
      parameters:
