openapi: 3.2.0
info:
  title: Umami Boards API
  version: 3.3.1
  license:
    identifier: MIT
    name: MIT
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Boards across 2 of this provider''s published API definitions: umami-openapi.json, umami-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{instance}
  description: Self-hosted Umami instance (paths begin with /api). Umami Cloud serves the same API at https://api.umami.is/v1 per docs.umami.is/docs/api.
  variables:
    instance:
      default: your-umami-instance.example.com
tags:
- name: Boards
paths:
  /api/boards:
    get:
      description: Returns a paginated list of the current user's boards, with search and sorting options.
      operationId: getBoards
      parameters:
      - description: Page number, starting at 1.
        in: query
        name: page
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Number of results per page.
        in: query
        name: pageSize
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Maximum number of results to include.
        in: query
        name: maxResults
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Search text used to filter results.
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: Field to sort the results by.
        in: query
        name: orderBy
        required: false
        schema:
          type: string
      - description: Whether to sort results in descending order.
        in: query
        name: sortDescending
        required: false
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  count:
                    description: Number of matching records.
                    type: number
                  data:
                    description: Data returned by the operation.
                    items:
                      properties:
                        createdAt:
                          description: Date and time the record was created.
                          format: date-time
                          type: string
                        description:
                          description: Description of the resource.
                          type: string
                        id:
                          description: Unique identifier of the resource.
                          type: string
                        name:
                          description: Display name of the resource.
                          type: string
                        parameters:
                          anyOf:
                          - type: string
                          - type: number
                          - const: false
                          - const: true
                          - additionalProperties:
                              anyOf:
                              - type: string
                              - type: number
                              - const: false
                              - const: true
                              - {}
                              - properties:
                                  length:
                                    type: number
                                required:
                                - length
                                type: object
                            properties: {}
                            type: object
                          - properties:
                              length:
                                type: number
                            required:
                            - length
                            type: object
                          description: Configuration parameters for the resource.
                        teamId:
                          description: ID of the associated team.
                          type: string
                        type:
                          type: string
                        updatedAt:
                          description: Date and time the record was last updated.
                          format: date-time
                          type: string
                        userId:
                          description: ID of the associated user.
                          type: string
                      required:
                      - id
                      - userId
                      - createdAt
                      - updatedAt
                      - name
                      - teamId
                      - type
                      - description
                      - parameters
                      type: object
                    type: array
                  isCapped:
                    description: Whether the results were truncated by the maximum result limit.
                    type: boolean
                  orderBy:
                    description: Field to sort the results by.
                    type: string
                  page:
                    description: Page number, starting at 1.
                    type: number
                  pageSize:
                    description: Number of results per page.
                    type: number
                  search:
                    description: Search text used to filter results.
                    type: string
                  sortDescending:
                    description: Whether to sort results in descending order.
                    type: boolean
                required:
                - data
                - count
                - page
                - pageSize
                type: object
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
