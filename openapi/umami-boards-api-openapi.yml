                  description:
                    description: Description of the resource.
                    type: string
                  id:
                    description: Unique identifier of the resource.
                    type: string
                  name:
                    description: Display name of the resource.
                    type: string
                  parameters:
                    anyOf:
                    - type: string
                    - type: number
                    - const: false
                    - const: true
                    - additionalProperties:
                        anyOf:
                        - type: string
                        - type: number
                        - const: false
                        - const: true
                        - {}
                        - properties:
                            length:
