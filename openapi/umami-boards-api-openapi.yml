  /api/boards/{boardId}/shares:
    get:
      description: Returns a paginated list of shares for the specified board.
      operationId: getBoardShares
      parameters:
      - description: ID of the board.
        in: path
        name: boardId
        required: true
        schema:
          type: string
      - description: Filter by page URL path.
        in: query
        name: path
        required: false
        schema:
          type: string
      - description: Filter by referring URL.
        in: query
        name: referrer
        required: false
        schema:
          type: string
      - description: Filter by page title.
        in: query
        name: title
        required: false
        schema:
          type: string
      - description: Filter by page URL query string.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: Operating system used by the visitor.
        in: query
        name: os
        required: false
        schema:
          type: string
      - description: Browser used by the visitor.
        in: query
