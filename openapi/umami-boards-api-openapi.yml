          description: Bad request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
      security:
      - bearerAuth: []
      - shareContext: []
        shareToken: []
      summary: List shares for a board
      tags:
      - Boards
      x-umami-audience: public
      x-umami-contract: explicit
      x-umami-source: src/app/api/boards/[boardId]/shares/contract.generated.ts
    post:
      description: Creates a named share for the specified board with optional parameters.
      operationId: createBoardShare
      parameters:
      - description: ID of the board.
        in: path
        name: boardId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
