          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
      security:
      - bearerAuth: []
      summary: List my boards
      tags:
      - Boards
      x-umami-audience: public
      x-umami-contract: explicit
      x-umami-source: src/app/api/boards/contract.generated.ts
    post:
      description: Creates a board with a name, type, and configuration, optionally assigned to a team. Validates access to its referenced resources and reports.
      operationId: createBoard
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  description: Description of the resource.
                  maxLength: 500
                  type: string
                name:
                  description: Display name of the resource.
                  maxLength: 100
                  type: string
                parameters:
                  description: Configuration parameters for the resource.
                  properties:
                    linkId:
                      description: ID of the tracked link.
                      format: uuid
                      type: string
                    pixelId:
                      description: ID of the tracking pixel.
                      format: uuid
                      type: string
                    websiteId:
                      description: ID of the website.
                      format: uuid
                      type: string
                  type: object
                teamId:
                  anyOf:
                  - format: uuid
                    type: string
                  - type: 'null'
                  description: ID of the associated team.
                type:
                  anyOf:
                  - enum: []
                    type: string
                  - const: open
                userId:
                  anyOf:
                  - format: uuid
                    type: string
                  - type: 'null'
                  description: ID of the associated user.
              required:
              - type
              - name
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  createdAt:
                    description: Date and time the record was created.
                    format: date-time
                    type: string
                  description:
                    description: Description of the resource.
                    type: string
                  id:
                    description: Unique identifier of the resource.
                    type: string
                  name:
                    description: Display name of the resource.
                    type: string
                  parameters:
                    anyOf:
                    - type: string
                    - type: number
                    - const: false
                    - const: true
                    - additionalProperties:
                        anyOf:
                        - type: string
                        - type: number
                        - const: false
                        - const: true
                        - {}
                        - properties:
                            length:
                              type: number
                          required:
                          - length
                          type: object
                      properties: {}
                      type: object
                    - properties:
                        length:
                          type: number
                      required:
                      - length
                      type: object
                    description: Configuration parameters for the resource.
                  teamId:
                    description: ID of the associated team.
                    type: string
                  type:
                    type: string
                  updatedAt:
                    description: Date and time the record was last updated.
                    format: date-time
                    type: string
                  userId:
                    description: ID of the associated user.
                    type: string
                required:
                - id
                - userId
                - createdAt
                - updatedAt
                - name
                - teamId
                - type
                - description
                - parameters
                type: object
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
                  code: bad-request
                  message: Bad request.
                  status: 400
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Bad request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
      security:
      - bearerAuth: []
      - shareContext: []
        shareToken: []
      summary: Create a board
      tags:
      - Boards
      x-umami-audience: public
      x-umami-contract: explicit
      x-umami-source: src/app/api/boards/contract.generated.ts
  /api/boards/{boardId}:
    delete:
      description: Deletes the specified board after checking the caller's permission to remove it.
      operationId: deleteBoard
      parameters:
      - description: ID of the board.
        in: path
        name: boardId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  ok:
                    const: true
                    description: Whether the operation succeeded.
                required:
