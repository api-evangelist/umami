        schema:
          type: string
      - description: ID of a saved segment used to filter results.
        in: query
        name: segment
        required: false
        schema:
          format: uuid
          type: string
      - description: ID of a saved cohort used to filter visitors.
        in: query
        name: cohort
        required: false
        schema:
          format: uuid
          type: string
      - description: 'Event type: 1 for a pageview or 2 for a custom event.'
        in: query
        name: eventType
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Whether records must match all filters or any filter.
        in: query
        name: match
        required: false
        schema:
          enum:
          - all
          - any
          type: string
      - description: Page number, starting at 1.
        in: query
        name: page
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Number of results per page.
        in: query
        name: pageSize
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Maximum number of results to include.
        in: query
        name: maxResults
