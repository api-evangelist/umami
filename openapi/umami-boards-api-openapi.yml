                          required:
                          - length
                          type: object
                      properties: {}
                      type: object
                    - properties:
                        length:
                          type: number
                      required:
                      - length
                      type: object
                    description: Configuration parameters for the resource.
                  teamId:
                    description: ID of the associated team.
                    type: string
                  type:
                    type: string
                  updatedAt:
                    description: Date and time the record was last updated.
                    format: date-time
                    type: string
                  userId:
                    description: ID of the associated user.
                    type: string
                required:
