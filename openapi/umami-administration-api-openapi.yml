          description: Unauthorized.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not-found
                  message: Not found.
                  status: 404
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Not found.
      security:
      - bearerAuth: []
      summary: Reset a user's two-factor authentication
      tags:
      - Administration
      x-umami-audience: internal
      x-umami-contract: explicit
      x-umami-source: src/app/api/admin/users/[userId]/2fa/contract.generated.ts
    get:
      description: Returns whether two-factor authentication is enabled for the specified user.
      operationId: getAdminUsersUserId2fa
      parameters:
      - description: ID of the associated user.
        in: path
        name: userId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  isEnabled:
                    description: Whether two-factor authentication is enabled.
                    type: boolean
                required:
                - isEnabled
                type: object
          description: The operation completed successfully.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not-found
                  message: Not found.
                  status: 404
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Not found.
      security:
      - bearerAuth: []
      summary: Get a user's two-factor status
      tags:
      - Administration
      x-umami-audience: internal
      x-umami-contract: explicit
      x-umami-source: src/app/api/admin/users/[userId]/2fa/contract.generated.ts
    post:
      description: Enables or disables the requirement for the specified user to set up two-factor authentication.
      operationId: postAdminUsersUserId2fa
      parameters:
      - description: ID of the associated user.
        in: path
        name: userId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                required:
                  type: boolean
              required:
              - required
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  ok:
                    description: Whether the operation succeeded.
