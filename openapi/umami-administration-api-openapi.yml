                  status: 404
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Not found.
        '503':
          content:
            application/json:
              example:
                error:
                  code: service-unavailable
                  message: Service unavailable.
                  status: 503
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Service unavailable.
      security:
      - bearerAuth: []
      summary: Set a team's two-factor requirement
      tags:
      - Administration
      x-umami-audience: internal
      x-umami-contract: explicit
      x-umami-source: src/app/api/admin/teams/[teamId]/2fa/contract.generated.ts
