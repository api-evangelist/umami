          description: Bad request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
      security:
      - bearerAuth: []
      - shareContext: []
        shareToken: []
      summary: List all users
      tags:
      - Administration
      x-umami-audience: internal
      x-umami-contract: explicit
      x-umami-source: src/app/api/admin/users/contract.generated.ts
  /api/admin/users/{userId}/2fa:
    delete:
      description: Removes the specified user's authenticator setup, backup codes, used-code history, and failed-attempt limits so they can set up authentication again.
      operationId: deleteAdminUsersUserId2fa
      parameters:
      - description: ID of the associated user.
        in: path
        name: userId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  ok:
                    description: Whether the operation succeeded.
                    type: boolean
                  reset:
                    properties:
                      backupCodes:
                        description: Single-use backup codes for two-factor authentication.
                      otpUsed: {}
                      rateLimit: {}
                      twoFactorAuth: {}
                    required:
                    - twoFactorAuth
                    - backupCodes
                    - otpUsed
                    - rateLimit
                    type: object
                  userId:
                    description: ID of the associated user.
                    type: string
                required:
                - ok
                - userId
                - reset
                type: object
          description: The operation completed successfully.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
