                                - type: string
                                - type: number
                                - const: false
                                - const: true
                                - {}
                                - properties:
                                    length:
                                      type: number
                                  required:
                                  - length
                                  type: object
                              properties: {}
                              type: object
                            - properties:
                                length:
                                  type: number
                              required:
                              - length
                              type: object
                            description: Session replay and heatmap recording configuration.
                          resetAt:
                            description: Date and time the website analytics were last reset.
                            format: date-time
                            type: string
                          teamId:
                            description: ID of the associated team.
                            type: string
                          updatedAt:
                            description: Date and time the record was last updated.
                            format: date-time
                            type: string
                          userId:
                            description: ID of the associated user.
                            type: string
                        required:
                        - id
                        - userId
                        - createdAt
                        - updatedAt
                        - deletedAt
                        - createdBy
                        - name
                        - domain
                        - resetAt
                        - teamId
                        - recorderEnabled
                        - replayConfig
                        type: object
                      - properties:
                          createUser:
                            description: User who created the resource.
                            properties:
                              id:
                                description: Unique identifier of the resource.
                                type: string
                              username:
                                description: Username of the account.
                                type: string
                            required:
                            - id
                            - username
                            type: object
                          shareId:
                            description: Identifier used to access a shared resource.
                            type: string
                          team:
                            description: Team associated with the resource.
                            properties:
                              members:
                                description: Members of the team.
                                items:
                                  properties:
                                    role:
                                      description: Permission role assigned to the user.
                                      type: string
                                    userId:
                                      description: ID of the associated user.
                                      type: string
                                  required:
                                  - userId
                                  - role
                                  type: object
                                type: array
                            required:
                            - members
                            type: object
                          user:
                            description: User associated with the resource.
                            properties:
                              id:
                                description: Unique identifier of the resource.
                                type: string
                              username:
                                description: Username of the account.
                                type: string
                            required:
                            - id
                            - username
                            type: object
                        required:
                        - shareId
                        type: object
                    type: array
                  isCapped:
                    description: Whether the results were truncated by the maximum result limit.
                    type: boolean
                  orderBy:
                    description: Field to sort the results by.
                    type: string
                  page:
                    description: Page number, starting at 1.
