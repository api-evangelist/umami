openapi: 3.2.0
info:
  title: Umami Administration API
  version: 3.3.1
  license:
    identifier: MIT
    name: MIT
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Administration across 2 of this provider''s published API definitions: umami-openapi.json, umami-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{instance}
  description: Self-hosted Umami instance (paths begin with /api). Umami Cloud serves the same API at https://api.umami.is/v1 per docs.umami.is/docs/api.
  variables:
    instance:
      default: your-umami-instance.example.com
tags:
- name: Administration
paths:
  /api/admin/2fa/global:
    post:
      description: Enables or disables the installation-wide requirement for users to set up two-factor authentication.
      operationId: postAdmin2faGlobal
      requestBody:
        content:
          application/json:
            schema:
              properties:
                required:
                  type: boolean
              required:
              - required
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  ok:
                    description: Whether the operation succeeded.
                    type: boolean
                  required: {}
                required:
                - ok
                - required
                type: object
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
                  code: bad-request
                  message: Bad request.
                  status: 400
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Bad request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not-found
                  message: Not found.
                  status: 404
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Not found.
        '503':
          content:
            application/json:
              example:
                error:
                  code: service-unavailable
                  message: Service unavailable.
                  status: 503
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Service unavailable.
      security:
      - bearerAuth: []
      summary: Set the two-factor requirement for everyone
      tags:
      - Administration
      x-umami-audience: internal
      x-umami-contract: explicit
      x-umami-source: src/app/api/admin/2fa/global/contract.generated.ts
  /api/admin/teams:
    get:
      description: Returns a paginated list of teams with member details and website and member counts for administration.
      operationId: getAdminTeams
      parameters:
      - description: Page number, starting at 1.
        in: query
        name: page
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Number of results per page.
        in: query
        name: pageSize
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Maximum number of results to include.
        in: query
        name: maxResults
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Search text used to filter results.
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: Field to sort the results by.
        in: query
        name: orderBy
        required: false
        schema:
          type: string
      - description: Whether to sort results in descending order.
        in: query
        name: sortDescending
        required: false
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  count:
                    description: Number of matching records.
                    type: number
                  data:
                    description: Data returned by the operation.
                    items:
                      properties:
                        accessCode:
                          description: Code used to join the team.
                          type: string
                        createdAt:
                          description: Date and time the record was created.
                          format: date-time
                          type: string
                        deletedAt:
                          description: Date and time the record was deleted, if applicable.
                          format: date-time
                          type: string
                        id:
                          description: Unique identifier of the resource.
                          type: string
                        logoUrl:
                          description: URL of the logo image.
                          type: string
                        name:
                          description: Display name of the resource.
                          type: string
                        twoFactorRequired:
                          description: Whether two-factor authentication is required.
                          type: boolean
                        updatedAt:
                          description: Date and time the record was last updated.
                          format: date-time
                          type: string
                      required:
                      - id
                      - createdAt
                      - updatedAt
                      - logoUrl
                      - twoFactorRequired
                      - deletedAt
                      - name
                      - accessCode
                      type: object
                    type: array
                  isCapped:
                    description: Whether the results were truncated by the maximum result limit.
                    type: boolean
                  orderBy:
                    description: Field to sort the results by.
                    type: string
                  page:
                    description: Page number, starting at 1.
                    type: number
                  pageSize:
                    description: Number of results per page.
                    type: number
                  search:
                    description: Search text used to filter results.
                    type: string
                  sortDescending:
                    description: Whether to sort results in descending order.
                    type: boolean
                required:
                - data
                - count
                - page
                - pageSize
                type: object
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
                  code: bad-request
                  message: Bad request.
                  status: 400
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Bad request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
      security:
      - bearerAuth: []
      - shareContext: []
        shareToken: []
      summary: List all teams
      tags:
      - Administration
      x-umami-audience: internal
      x-umami-contract: explicit
      x-umami-source: src/app/api/admin/teams/contract.generated.ts
  /api/admin/teams/{teamId}/2fa:
    post:
      description: Enables or disables the requirement for members of the specified team to use two-factor authentication.
      operationId: postAdminTeamsTeamId2fa
      parameters:
      - description: ID of the associated team.
        in: path
        name: teamId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                required:
                  type: boolean
              required:
              - required
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  ok:
                    description: Whether the operation succeeded.
                    type: boolean
                  teamId:
                    description: ID of the associated team.
                    type: string
                  twoFactorRequired:
                    description: Whether two-factor authentication is required.
                required:
                - ok
                - teamId
                - twoFactorRequired
                type: object
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
                  code: bad-request
                  message: Bad request.
                  status: 400
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Bad request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
