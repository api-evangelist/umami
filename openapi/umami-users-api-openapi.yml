  description: 'Operations tagged Users across 2 of this provider''s published API definitions: umami-openapi.json, umami-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{instance}
  description: Self-hosted Umami instance (paths begin with /api). Umami Cloud serves the same API at https://api.umami.is/v1 per docs.umami.is/docs/api.
  variables:
    instance:
      default: your-umami-instance.example.com
tags:
- name: Users
paths:
  /api/users:
    post:
      description: Creates a user account with the supplied username, password, and role.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              properties:
                id:
                  description: Unique identifier of the resource.
                  format: uuid
                  type: string
                password:
                  description: Password used to authenticate the account.
                  maxLength: 255
                  minLength: 8
                  type: string
                role:
                  description: Permission role assigned to the user.
                  enum:
                  - admin
                  - user
                  - view-only
                  type: string
                username:
                  description: Username of the account.
                  maxLength: 255
                  type: string
              required:
              - username
              - password
              - role
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    description: Unique identifier of the resource.
                    type: string
                  role:
                    description: Permission role assigned to the user.
                    type: string
                  username:
                    description: Username of the account.
                    type: string
                required:
                - id
                - username
                - role
                type: object
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
                  code: bad-request
                  message: Bad request.
                  status: 400
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Bad request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
      security:
      - bearerAuth: []
      summary: Create a user
      tags:
      - Users
      x-umami-audience: public
      x-umami-contract: explicit
      x-umami-source: src/app/api/users/contract.generated.ts
  /api/users/{userId}:
    delete:
      description: Deletes the specified user account. The current user cannot delete their own account through this operation.
      operationId: deleteUser
      parameters:
      - description: ID of the associated user.
        in: path
        name: userId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  ok:
                    const: true
                    description: Whether the operation succeeded.
                required:
                - ok
                type: object
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
                  code: bad-request
                  message: Bad request.
                  status: 400
              schema:
