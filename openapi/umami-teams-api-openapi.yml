openapi: 3.2.0
info:
  title: Umami Teams API
  version: 3.3.1
  license:
    identifier: MIT
    name: MIT
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Teams across 2 of this provider''s published API definitions: umami-openapi.json, umami-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{instance}
  description: Self-hosted Umami instance (paths begin with /api). Umami Cloud serves the same API at https://api.umami.is/v1 per docs.umami.is/docs/api.
  variables:
    instance:
      default: your-umami-instance.example.com
tags:
- name: Teams
paths:
  /api/teams:
    get:
      description: Returns a paginated list of teams the current user belongs to, with sorting options.
      operationId: getTeams
      parameters:
      - description: Page number, starting at 1.
        in: query
        name: page
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Number of results per page.
        in: query
        name: pageSize
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Maximum number of results to include.
        in: query
        name: maxResults
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Field to sort the results by.
        in: query
        name: orderBy
        required: false
        schema:
          type: string
      - description: Whether to sort results in descending order.
        in: query
        name: sortDescending
        required: false
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  count:
                    description: Number of matching records.
                    type: number
                  data:
                    description: Data returned by the operation.
                    items:
                      properties:
                        accessCode:
                          description: Code used to join the team.
                          type: string
                        createdAt:
                          description: Date and time the record was created.
                          format: date-time
                          type: string
                        deletedAt:
                          description: Date and time the record was deleted, if applicable.
                          format: date-time
                          type: string
                        id:
                          description: Unique identifier of the resource.
                          type: string
                        logoUrl:
                          description: URL of the logo image.
                          type: string
                        name:
                          description: Display name of the resource.
                          type: string
                        twoFactorRequired:
                          description: Whether two-factor authentication is required.
                          type: boolean
                        updatedAt:
                          description: Date and time the record was last updated.
                          format: date-time
                          type: string
                      required:
                      - id
                      - createdAt
                      - updatedAt
                      - logoUrl
                      - twoFactorRequired
                      - deletedAt
                      - name
                      - accessCode
                      type: object
                    type: array
                  isCapped:
                    description: Whether the results were truncated by the maximum result limit.
                    type: boolean
                  orderBy:
                    description: Field to sort the results by.
                    type: string
                  page:
                    description: Page number, starting at 1.
                    type: number
                  pageSize:
                    description: Number of results per page.
                    type: number
                  search:
                    description: Search text used to filter results.
                    type: string
                  sortDescending:
                    description: Whether to sort results in descending order.
                    type: boolean
                required:
                - data
                - count
                - page
                - pageSize
                type: object
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
                  code: bad-request
                  message: Bad request.
                  status: 400
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Bad request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Unauthorized.
                  status: 401
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized.
      security:
      - bearerAuth: []
      summary: List my teams
      tags:
      - Teams
      x-umami-audience: public
      x-umami-contract: explicit
      x-umami-source: src/app/api/teams/contract.generated.ts
