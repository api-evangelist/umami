      description: Creates a team with an access code and an owner. Administrators can specify a different user as the owner.
      operationId: createTeam
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: Display name of the resource.
                  maxLength: 50
                  type: string
                ownerId:
                  format: uuid
                  type: string
              required:
              - name
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                maxItems: 2
                minItems: 2
                prefixItems:
                - properties:
                    accessCode:
                      description: Code used to join the team.
                      type: string
                    createdAt:
                      description: Date and time the record was created.
                      format: date-time
                      type: string
                    deletedAt:
                      description: Date and time the record was deleted, if applicable.
                      format: date-time
                      type: string
                    id:
                      description: Unique identifier of the resource.
                      type: string
                    logoUrl:
                      description: URL of the logo image.
                      type: string
                    name:
                      description: Display name of the resource.
                      type: string
                    twoFactorRequired:
                      description: Whether two-factor authentication is required.
                      type: boolean
                    updatedAt:
                      description: Date and time the record was last updated.
                      format: date-time
                      type: string
                  required:
                  - id
                  - createdAt
                  - updatedAt
                  - logoUrl
                  - twoFactorRequired
                  - deletedAt
                  - name
                  - accessCode
                  type: object
                - properties:
                    createdAt:
                      description: Date and time the record was created.
                      format: date-time
                      type: string
                    id:
                      description: Unique identifier of the resource.
                      type: string
                    role:
                      description: Permission role assigned to the user.
                      type: string
                    teamId:
                      description: ID of the associated team.
                      type: string
                    updatedAt:
                      description: Date and time the record was last updated.
                      format: date-time
                      type: string
                    userId:
                      description: ID of the associated user.
                      type: string
                  required:
                  - id
                  - userId
                  - createdAt
                  - updatedAt
                  - role
                  - teamId
                  type: object
                type: array
          description: The operation completed successfully.
        '400':
          content:
            application/json:
              example:
                error:
                  code: bad-request
                  message: Bad request.
                  status: 400
              schema:
